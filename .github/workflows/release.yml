name: Release

# Dispatch only. The version is computed as YY.M.revision from the date and
# the tag list, like every other repo, rather than typed by hand.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable
      dry-run:
        description: Build and sign, but publish nothing and tag nothing
        required: false
        default: false
        type: boolean
      force-version:
        description: Re-cut this exact version instead of computing the next one
        required: false
        default: ""
        type: string

# Serialised across the whole repo, not per-ref. This job pushes appcast.xml
# back to main, and two releases racing there would clobber each other's item.
concurrency:
  group: release-layerlens
  cancel-in-progress: false

jobs:
  build-dmg:
    name: Build & Sign DMG
    runs-on: macos-latest
    permissions:
      contents: write        # tags and publishes the Release
      pull-requests: write   # opens the appcast PR
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # compute-version reads the tag list, and a shallow clone has none.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compute version
        id: version
        uses: FireBall1725/workflows/actions/compute-version@v1
        with:
          channel: ${{ inputs.channel }}
          force-version: ${{ inputs.force-version }}

      # ─── Code-signing (skipped on PRs and forks where secrets are absent) ───
      # The release workflow expects four secrets, all pulled from the same
      # Apple Developer account librarium-ios uses:
      #
      #   MACOS_CERT_BASE64       Developer ID Application .p12, base64-encoded
      #   MACOS_CERT_PASSWORD     password for that .p12
      #   KEYCHAIN_PASSWORD       any string; gates the temp keychain
      #   ASC_KEY_ID/ASC_ISSUER_ID/ASC_PRIVATE_KEY  App Store Connect key for notarytool
      #
      # If MACOS_CERT_BASE64 is empty, the workflow ad-hoc signs the app and
      # skips notarization — fine for personal-use builds, will trigger
      # Gatekeeper on other Macs.
      - name: Detect signing config
        id: signing
        run: |
          if [[ -n "${{ secrets.MACOS_CERT_BASE64 }}" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Using Developer ID signing + notarization"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERT_BASE64 secret — falling back to ad-hoc signing (no notarization)."
          fi

      - name: Install signing certificate
        if: steps.signing.outputs.mode == 'full'
        env:
          CERTIFICATE_BASE64:    ${{ secrets.MACOS_CERT_BASE64 }}
          CERTIFICATE_PASSWORD:  ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD:     ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)

      - name: Build .app bundle
        run: Tools/build_app.sh "${{ steps.version.outputs.version }}"

      - name: Sign .app (Developer ID)
        if: steps.signing.outputs.mode == 'full'
        run: |
          codesign --deep --force --options runtime --timestamp \
            --sign "Developer ID Application" \
            dist/LayerLens.app
          codesign --verify --verbose=2 dist/LayerLens.app

      - name: Sign .app (ad-hoc fallback)
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          codesign --deep --force --sign - dist/LayerLens.app
          codesign --verify --verbose=2 dist/LayerLens.app

      - name: Install create-dmg
        # Pre-installed on macos-latest? Install defensively in case the
        # runner image doesn't include it; brew is no-op when it's there.
        run: brew install create-dmg

      - name: Build DMG
        run: Tools/build_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Notarize DMG
        if: steps.signing.outputs.mode == 'full'
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          xcrun notarytool submit \
            "dist/LayerLens-${{ steps.version.outputs.version }}.dmg" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/LayerLens-${{ steps.version.outputs.version }}.dmg"

      - name: Sign DMG for Sparkle (EdDSA)
        # Run AFTER notarisation/stapling so the signature reflects the final
        # bytes users will download. sign_update emits "sparkle:edSignature=..."
        # and "length=..." attributes; we only need the signature here, since
        # update_appcast.sh recomputes length from the local file.
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        id: sparkle
        run: |
          curl -sSL -o /tmp/Sparkle.tar.xz \
            https://github.com/sparkle-project/Sparkle/releases/download/2.7.2/Sparkle-2.7.2.tar.xz
          mkdir -p /tmp/sparkle-bin && tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle-bin
          PRIV_FILE="$RUNNER_TEMP/sparkle_priv.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIV_FILE"
          OUTPUT=$(/tmp/sparkle-bin/bin/sign_update -f "$PRIV_FILE" \
            "dist/LayerLens-${{ steps.version.outputs.version }}.dmg")
          rm -f "$PRIV_FILE"
          # Output looks like: sparkle:edSignature="..." length="..."
          ED_SIG=$(echo "$OUTPUT" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')
          echo "edSignature=$ED_SIG" >> "$GITHUB_OUTPUT"

      - name: Update the appcast feeds
        # A stable release goes in both feeds; an rc only in the prerelease
        # one. Sparkle's comparator does not understand SemVer pre-release
        # precedence, so an rc in the stable feed can be offered to everyone
        # and then the real release may not look newer than it.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG="dist/LayerLens-${VERSION}.dmg"
          SIG="${{ steps.sparkle.outputs.edSignature }}"

          Tools/update_appcast.sh "$VERSION" "$DMG" "$SIG" appcast-prerelease.xml
          if [ "${{ inputs.channel }}" = "stable" ]; then
            Tools/update_appcast.sh "$VERSION" "$DMG" "$SIG" appcast.xml
          fi

      - name: Publish the appcast through a pull request
        # main is protected and requires a pull request, so this opens one and
        # merges it rather than pushing directly. A ruleset cares how a change
        # reaches main, not who sent it, so GITHUB_TOKEN is enough and no
        # bypass or long-lived PAT is needed.
        #
        # The appcast has to land on main specifically: UpdateController's
        # publicAppcastURL is compiled into every shipped copy and points at
        # the raw main URL, so an installed app reads that path or it never
        # sees another update.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The build ran against the tag, so save the regenerated feeds before
          # switching branches or the checkout discards them.
          cp appcast.xml appcast-prerelease.xml "$RUNNER_TEMP/"
          git fetch origin main
          git checkout -B "appcast/v${VERSION}" origin/main
          cp "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/appcast-prerelease.xml" .
          git add appcast.xml appcast-prerelease.xml

          if git diff --cached --quiet; then
            echo "appcast unchanged; nothing to publish."
            exit 0
          fi

          git commit -s -m "appcast: publish v${VERSION}"
          git push -f origin "HEAD:appcast/v${VERSION}"

          gh pr create --base main --head "appcast/v${VERSION}" \
            --title "appcast: publish v${VERSION}" \
            --body "Adds the v${VERSION} entry to the update feed. Opened by the release workflow." \
            || echo "PR already open."

          # --auto needs the repo setting and a green check; the plain merge is
          # the fallback so a release does not stall on a config detail. The
          # appcast is what installed copies read, so it must not sit unmerged.
          gh pr merge "appcast/v${VERSION}" --squash --delete-branch --auto \
            || gh pr merge "appcast/v${VERSION}" --squash --delete-branch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LayerLens-${{ steps.version.outputs.version }}-dmg
          path: dist/LayerLens-${{ steps.version.outputs.version }}.dmg

      # Notes come from the shared git-cliff config, so the Release body and
      # the Discord post are rendered from one source and cannot disagree.
      - name: Generate changelog
        id: changelog
        uses: FireBall1725/workflows/actions/changelog@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          since: ${{ inputs.channel == 'stable' && steps.version.outputs.previous-stable-tag || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # These two used to be gated on
      #   github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      # which is false under workflow_dispatch. Moving the trigger without
      # rewriting them would have built, signed, notarised, committed an
      # appcast entry pointing at a download that does not exist, and published
      # no Release at all: every installed copy would then fail its update
      # check against a 404.
      - name: Tag release
        if: ${{ !inputs.dry-run }}
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/LayerLens-${{ steps.version.outputs.version }}.dmg
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ steps.version.outputs.is-prerelease == 'true' }}
          make_latest: ${{ inputs.channel == 'stable' }}

      - name: Clean up keychain
        if: always() && steps.signing.outputs.mode == 'full'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  # A Discord outage must never fail a release whose dmg and tag are already
  # published; every step inside the announce workflow is continue-on-error.
  announce:
    needs: build-dmg
    if: ${{ !inputs.dry-run }}
    uses: FireBall1725/workflows/.github/workflows/announce-discord.yml@v1
    with:
      version: ${{ needs.build-dmg.outputs.version }}
      channel: ${{ inputs.channel }}
    secrets: inherit
