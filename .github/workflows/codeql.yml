name: CodeQL

# Free on public repos, and this one is public. Every other repo in the fleet
# runs it; a repo without it is an oversight rather than a decision.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@v3
