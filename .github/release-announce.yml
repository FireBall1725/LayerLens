# Drives the Discord post in #releases. Field list and placeholders:
# https://github.com/FireBall1725/workflows/blob/main/templates/release-announce.yml.example

project:
  name: LayerLens
  emoji: "🔍"
  footer: "LayerLens · see which layer your keyboard is on"

channels:
  stable:
    announce: true
    colour: "0x2ECC71"
    prefix: ""
  rc:
    announce: true
    colour: "0xF1C40F"
    prefix: "Release candidate — "
  nightly:
    announce: false

getting_started: |
  Download the signed `.dmg` from the release and drag it to Applications.
  Installed copies update themselves through Sparkle.

  Release candidates are **not** offered to the normal update feed. To test
  one, download it here or point the app at `appcast-prerelease.xml`.

links:
  - name: Site
    url: https://fireball1725.github.io/LayerLens/
  - name: Download
    url: https://github.com/{{repo}}/releases/latest
  - name: Changes
    url: "{{compare_url}}"
